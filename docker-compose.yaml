# `docker compose up -d` starts only the app's dependencies; the app itself
# runs on the host (see DOCKER-README.md).
#
# Optional profiles:
#   --profile queue    redis, for QUEUE_CONNECTION=redis
#   --profile app      the app itself, built from the production image

services:
  # Host ports come from .env (compose reads it for ${VAR} interpolation), so
  # if a port clashes with another project, change it once in .env and both
  # the container mapping and the app's connection follow.
  postgres:
    image: postgres:13.1-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=ponyfm
      - POSTGRES_PASSWORD=ponyfm
      - POSTGRES_DB=ponyfm
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.12.0
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  # Local mail catcher: SMTP on ${MAIL_PORT}, web UI on ${MAILPIT_UI_PORT}.
  # Point the app at it with MAIL_MAILER=smtp (see .env.example).
  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Prod-like smoke test: runs the baked image (FrankenPHP/Octane + ffmpeg +
  # AtomicParsley in one container), no code mounts.
  #   docker compose --profile app up -d --build
  web:
    build: .
    image: ponyfm
    profiles: ["app"]
    platform: linux/amd64
    ports:
      - "8000:8080"
    command:
      - web
    environment:
      # Dev-only key, same as .env.example.
      - APP_KEY=base64:O8oDL/1AMZq2dxTskgjeg/2AhvxTYSwmKXfvcErLMq8=
      - APP_ENV=local
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_DATABASE=ponyfm
      - DB_USERNAME=ponyfm
      - DB_PASSWORD=ponyfm
      - ELASTICSEARCH_HOST=elasticsearch
      - QUEUE_CONNECTION=sync
      - MAIL_MAILER=log
      - PONYFM_DATASTORE=/app/storage/app/datastore
      - INERTIA_SSR_ENABLED=true
      - INERTIA_SSR_URL=http://ssr:13714
    depends_on:
      - postgres
      - elasticsearch
      - ssr
    volumes:
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro

  # Inertia SSR server (Node). inertia-laravel falls back to client-side
  # rendering automatically if this is down.
  ssr:
    build:
      context: .
      target: ssr
    image: ponyfm-ssr
    profiles: ["app"]
    platform: linux/amd64

volumes:
  postgres-data:
  elasticsearch-data:
  redis-data:
